<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DyslexAid</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>DyslexAid</h1>
    <p class="tagline">Make this page easier to read</p>
  </header>

  <label class="row site-row" id="site-row" hidden>
    <span class="emoji" aria-hidden="true">🌐</span>
    <span class="text">
      <span class="name">On this site</span>
      <span class="desc" id="site-host"></span>
    </span>
    <input type="checkbox" id="site-toggle">
    <span class="switch"></span>
  </label>

  <main id="toggles">
    <label class="row">
      <span class="emoji" aria-hidden="true">🔤</span>
      <span class="text">
        <span class="name">Friendly font</span>
        <span class="desc">Rounded letters, wider spacing</span>
      </span>
      <input type="checkbox" data-feature="font">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">📏</span>
      <span class="text">
        <span class="name">Comfy spacing</span>
        <span class="desc">Taller lines, shorter paragraphs</span>
      </span>
      <input type="checkbox" data-feature="spacing">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">⚡</span>
      <span class="text">
        <span class="name">Bionic reading</span>
        <span class="desc">Bold word-starts guide your eye</span>
      </span>
      <input type="checkbox" data-feature="bionic">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">🖍️</span>
      <span class="text">
        <span class="name">Reading ruler</span>
        <span class="desc">A highlight bar follows your cursor</span>
      </span>
      <input type="checkbox" data-feature="ruler">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">🎯</span>
      <span class="text">
        <span class="name">Line focus</span>
        <span class="desc">Dims everything but your line</span>
      </span>
      <input type="checkbox" data-feature="focus">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">🌅</span>
      <span class="text">
        <span class="name">Tint</span>
        <span class="desc">Softer background, less glare</span>
      </span>
      <input type="checkbox" data-feature="tint">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">🧘</span>
      <span class="text">
        <span class="name">Calm mode</span>
        <span class="desc">Freezes animations and motion</span>
      </span>
      <input type="checkbox" data-feature="calm">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">🖼️</span>
      <span class="text">
        <span class="name">Hide images</span>
        <span class="desc">Fades pictures, hover to reveal one</span>
      </span>
      <input type="checkbox" data-feature="images">
      <span class="switch"></span>
    </label>

    <label class="row">
      <span class="emoji" aria-hidden="true">🔗</span>
      <span class="text">
        <span class="name">Underline links</span>
        <span class="desc">Restores removed underlines</span>
      </span>
      <input type="checkbox" data-feature="links">
      <span class="switch"></span>
    </label>

    <div class="row zoom-row">
      <span class="emoji" aria-hidden="true">🔍</span>
      <span class="text">
        <span class="name" id="zoom-label">Text size</span>
        <span class="desc">Zoom the page</span>
      </span>
      <span class="stepper" role="group" aria-labelledby="zoom-label">
        <button id="zoom-down" aria-label="Smaller text">−</button>
        <span id="zoom-value" aria-live="polite">100%</span>
        <button id="zoom-up" aria-label="Bigger text">+</button>
      </span>
    </div>

    <button class="row action" id="speak">
      <span class="emoji" aria-hidden="true">🔊</span>
      <span class="text">
        <span class="name">Read aloud</span>
        <span class="desc">Reads your selection, or the whole article</span>
      </span>
    </button>
  </main>

  <footer>
    <button id="shortcuts">Shortcuts</button>
    <button id="options">Settings</button>
    <button id="reset">Reset all</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
